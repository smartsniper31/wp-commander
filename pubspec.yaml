name: wp_commander
description: Ultimate WordPress Mobile Manager - Manage your WordPress sites from mobile
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  meta: ^1.15.0
  collection: ^1.18.0
  # État de l'application
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed: ^2.5.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0
  # HTTP & API
  http: ^1.2.1
  dio: ^5.3.0
  # Persistance des données
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Internationalisation
  flutter_localizations:
    sdk: flutter
  # Connexion réseau
  connectivity_plus: ^7.0.0
  # Sécurité
  encrypt: ^5.0.1
  crypto: ^3.0.3
  # Utilitaires
  url_launcher: ^6.2.0
  package_info_plus: ^9.0.0
  flutter_dotenv: ^6.0.0
  go_router: ^17.0.0
  equatable: ^2.0.7
  logging: ^1.2.0
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^19.5.0
  either_dart: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - .env
    - assets/translations/
